# ~/.config/tmux/tmux.conf
# Reload: prefix + r

# --- Terminal ---
set  -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-kitty:RGB:extkeys"
set -ga terminal-features ",*:usstyle"
set  -s extended-keys on
set -sg escape-time 10
set  -g focus-events on

# --- Behaviour ---
set  -g mouse on
set  -g history-limit 50000
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
setw -g automatic-rename off
set  -g set-titles on
set  -g set-titles-string "#S / #W"

# --- Splits (open in current dir) ---
bind c   new-window   -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# --- Panes: Ctrl+hjkl or prefix+hjkl to move, prefix+HJKL to resize ---
# Ctrl+hjkl is passed through to vim/fzf when they are in the focused pane.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(-wrapped)?(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode: v select, y copy to clipboard ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Shortcuts ---
bind r     source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind g     display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind Enter display-popup -E -w 80% -h 70% -d "#{pane_current_path}"
bind s     choose-tree -Zs
# prefix + C: jump to this session's "claude" window, creating it if needed
bind C run-shell 'tmux select-window -t "=#{session_name}:claude" 2>/dev/null || { tmux new-window -n claude -c "#{pane_current_path}"; tmux send-keys -t "=#{session_name}:claude" claude Enter; }'

# --- Status line (TokyoNight) ---
set  -g status-position top
set  -g status-interval 5
set  -g status-style   "bg=#1a1b26,fg=#565f89"
set  -g status-left    "#[fg=#7aa2f7,bold] #S #[default]"
set  -g status-right   "#[fg=#565f89]%H:%M "
set  -g status-left-length 30
setw -g window-status-format         " #I #W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I #W "
set  -g pane-border-style        "fg=#292e42"
set  -g pane-active-border-style "fg=#7aa2f7"
set  -g message-style            "bg=#1a1b26,fg=#7aa2f7"
