# ~/.config/kitty/kitty.conf
# Colors live in light-/dark-theme.auto.conf (Nord dark, TokyoNight Day light), switched by macOS appearance.
# Reload: ctrl+cmd+,

# --- Font ---
font_family JetBrainsMono Nerd Font
font_size   13.0

# --- Cursor / mouse ---
cursor_blink_interval 0
mouse_hide_wait       -1

# --- Keyboard: left Option sends Alt (for nvim/tmux Option+key binds) ---
macos_option_as_alt left

# --- Window ---
window_padding_width    4 8

scrollback_lines 10000

# --- Title bar ---
macos_titlebar_color background
shell_integration    no-title

# --- Splits: nvim on the left, terminals (for the agent) on the right ---
# nvim opens and moves between these windows through this socket.
allow_remote_control socket-only
listen_on            unix:/tmp/kitty
enabled_layouts      splits,stack

# Same Option keys as in nvim. kitty handles them in the right-hand terminals.
map alt+a     neighboring_window left
map alt+d     neighboring_window right
map alt+w     neighboring_window up
map alt+s     neighboring_window down
map alt+up    neighboring_window up
map alt+down  neighboring_window down
map alt+t     launch --location=hsplit --cwd=current
map alt+x     close_window
map alt+`     toggle_layout stack

# While nvim is focused these keys go to nvim instead (nvim/lua/config/kitty.lua).
map --when-focus-on var:in_editor alt+a
map --when-focus-on var:in_editor alt+d
map --when-focus-on var:in_editor alt+w
map --when-focus-on var:in_editor alt+s
map --when-focus-on var:in_editor alt+up
map --when-focus-on var:in_editor alt+down
map --when-focus-on var:in_editor alt+t
map --when-focus-on var:in_editor alt+x
map --when-focus-on var:in_editor alt+`
